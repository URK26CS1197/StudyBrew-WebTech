<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | StudyBrew</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">☕ StudyBrew</a><nav><a href="index.html#features">Features</a><a href="signin.html">Sign In</a><a href="register.html">Register</a><a href="home.html">Dashboard</a></nav><button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button></header><main class="form-box card"><h2>Create your profile</h2><form data-validate novalidate><label for="name">Full Name</label><div><input id="name" name="name" type="text" data-rule="name" placeholder="Your name" ><span class="error-msg"></span></div><label for="empId">Register ID</label><div><input id="empId" name="empId" type="text" data-rule="empId" placeholder="e.g. URK26CS1001" ><span class="error-msg"></span></div><label for="email">Email Address</label><div><input id="email" name="email" type="email" data-rule="email" placeholder="you@example.com" ><span class="error-msg"></span></div><label for="mobile">Mobile Number</label><div><input id="mobile" name="mobile" type="tel" data-rule="mobile" placeholder="9876543210" ><span class="error-msg"></span></div><label for="dept">Division</label><div><select id="dept" data-rule="dept"><option value="">-- Select --</option><option>Computer Science &amp; Engineering</option><option>Information Technology</option><option>Electronics &amp; Communication</option><option>Mechanical</option></select><span class="error-msg"></span></div><label for="password">Password</label><div><input id="password" name="password" type="password" data-rule="pw" placeholder="Strong password" ><span class="error-msg"></span></div><label for="confirm">Confirm Password</label><div><input id="confirm" name="confirm" type="password" data-rule="match" placeholder="Repeat password" data-match="password"><span class="error-msg"></span></div><br><button type="submit" disabled>Register</button> <a href="signin.html">Already registered?</a></form></main><script src="theme.js"></script><script src="validation.js"></script></body></html>
