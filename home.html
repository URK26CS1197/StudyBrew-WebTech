<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | StudyBrew</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="layout.css"></head><body><header class="nav"><a class="brand" href="index.html">☕ StudyBrew</a><nav><a href="index.html#features">Features</a><a href="signin.html">Sign In</a><a href="register.html">Register</a><a href="home.html">Dashboard</a></nav><button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button><button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button></header><div class="dash"><aside id="sidebar" class="card"><h3>Menu</h3><a class="side-link" href="#assignments">📚 Assignments</a><a class="side-link" href="#todo">✅ To-Do</a><a class="side-link" href="#quiz-sec">🧠 Quiz</a><a class="side-link" href="#pomo">⏱️ Pomodoro</a><hr><h3>Today</h3><div class="stat"><span>Pending assignments</span><b id="sA">0</b></div><div class="stat"><span>Tasks done</span><b id="sT">0</b></div><div class="stat"><span>Pomodoros</span><b id="sP">0</b></div></aside>
<main class="stack"><section class="card" id="assignments"><h2>📚 Assignments</h2><form id="aForm" class="row"><input id="aT" placeholder="Title" required><input id="aS" placeholder="Subject"><input id="aD" type="date" required><button>Add</button></form><div id="aList"></div></section>
<section class="card" id="todo"><h2>✅ To-Do List</h2><form id="tForm" class="row"><input id="tIn" placeholder="New task" required><button>Add</button></form><div id="tList"></div></section>
<section class="card" id="quiz-sec"><h2>🧠 Quick Quiz</h2><div id="quiz"></div></section></main>
<aside class="stack"><section class="card" id="pomo"><h2>⏱️ Pomodoro</h2><div class="tabs row"><button class="on" data-m="focus">Focus</button><button data-m="short">Short</button><button data-m="long">Long</button></div><div class="timer" id="time">25:00</div><div class="row"><button id="pStart">Start</button><button id="pReset">Reset</button></div></section>
<section class="card"><h2>🧮 Calculator</h2><div id="display">0</div><div class="keys" id="keys"></div></section></aside></div><script src="theme.js"></script><script src="app.js"></script><script src="calculator.js"></script><script src="chatbot.js"></script></body></html>
